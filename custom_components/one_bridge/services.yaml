mail_send_prepared:
  name: Send prepared mail
  description: Internal One Bridge service that executes only an active server-prepared mail mutation.
  fields:
    prepare_id:
      name: Prepare ID
      description: Server-generated identifier for the active prepared mutation.
      required: true
      selector:
        text:
    mime_sha256:
      name: MIME SHA-256
      description: SHA-256 fingerprint of the exact prepared MIME message.
      required: true
      selector:
        text:
mail_sent_folder_detect_prepared:
  name: Detect sent folder (prepared)
  description: Internal One Bridge service that executes only an active server-prepared sent-folder detection.
  fields:
    prepare_id:
      name: Prepare ID
      description: Server-generated identifier for the active prepared mutation.
      required: true
      selector:
        text:
    imap_entry_id:
      name: IMAP entry ID
      description: Config entry ID of the IMAP integration bound in the prepared mutation.
      required: true
      selector:
        text:
